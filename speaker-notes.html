<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speaker Notes — Podium Viewer</title>
<script src="marked.min.js"></script>
<style>
  @font-face {
    font-family: 'Inter';
    src: url('fonts/InterVariable.woff2') format('woff2') tech('variations');
    font-weight: 100 900;
    font-style: normal;
    font-display: swap;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #1e1e1e;
    --surface: #2a2a2a;
    --surface2: #333;
    --text: #f6f5f4;
    --text-dim: #9a9996;
    --accent: #3584e4;
    --radius: 12px;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  html, body {
    height: 100%;
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
  }
  body {
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 0;
    padding: 16px;
    height: 100vh;
  }

  /* ── Timer ── */
  .timer-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 8px 0 12px;
  }
  .timer-display {
    font-size: 2.2rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.05em;
    color: var(--text);
    min-width: 8ch;
    text-align: center;
  }
  .timer-btn {
    background: var(--surface2);
    border: none;
    color: var(--text);
    border-radius: 8px;
    padding: 6px 14px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    font-family: var(--font);
    transition: background 0.15s;
  }
  .timer-btn:hover { background: var(--accent); }
  .timer-btn.destructive:hover { background: #c01c28; }

  /* ── Main area ── */
  .main-area {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto 1fr;
    gap: 12px;
    min-height: 0;
    overflow: hidden;
  }

  /* ── Slide previews ── */
  .preview {
    background: var(--surface);
    border-radius: var(--radius);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .preview-label {
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    padding: 8px 12px 4px;
  }
  .preview-slide {
    flex: 1;
    padding: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .preview-slide-inner {
    border-radius: 6px;
    width: 100%;
    aspect-ratio: 16/9;
    overflow: hidden;
    position: relative;
    background: white;
    background-size: cover;
    background-position: center;
  }
  /* The actual slide replica lives inside here, scaled down */
  .preview-slide-inner .slide-replica {
    position: absolute;
    top: 0; left: 0;
    width: 1920px;
    height: 1080px;
    transform-origin: top left;
    pointer-events: none;
    overflow: hidden;
    /* flex layout matching the main viewer */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 4rem 5rem;
    font-family: var(--font);
  }
  .preview-slide-inner .slide-replica h1 { font-size: 4.8rem; font-weight: 800; line-height: 1.15; margin: 0; }
  .preview-slide-inner .slide-replica h2 { font-size: 2.4rem; font-weight: 600; line-height: 1.2; margin: 0; }
  .preview-slide-inner .slide-replica h3 { font-size: 1.8rem; font-weight: 500; line-height: 1.25; margin: 0; }
  .preview-slide-inner .slide-replica h4 { font-size: 1.4rem; font-weight: 600; line-height: 1.3; margin: 0; }
  .preview-slide-inner .slide-replica img { display: none; }

  .preview-slide-inner .slide-bg-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
  }
  .preview-slide-inner .slide-replica { z-index: 1; }

  .preview.next-slide .preview-slide-inner { opacity: 0.5; }
  .preview.next-slide.has-next .preview-slide-inner { opacity: 1; }

  .preview-end {
    color: var(--text-dim);
    font-style: italic;
    font-size: 0.75rem;
  }

  /* ── Notes ── */
  .notes-panel {
    grid-column: 1 / -1;
    background: var(--surface);
    border-radius: var(--radius);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .notes-label {
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    padding: 10px 16px 6px;
    flex-shrink: 0;
  }
  .notes-content {
    flex: 1;
    overflow-y: auto;
    padding: 4px 16px 16px;
    font-size: 1.2rem;
    line-height: 1.6;
  }
  .notes-content::-webkit-scrollbar { width: 6px; }
  .notes-content::-webkit-scrollbar-track { background: transparent; }
  .notes-content::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 3px; }
  .notes-content p { margin-bottom: 0.8em; }
  .notes-content em { font-style: italic; color: var(--text-dim); }
  .notes-empty {
    color: var(--text-dim);
    font-style: italic;
  }

  /* ── Bottom bar ── */
  .bottom-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0 0;
    gap: 12px;
  }
  .slide-counter {
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }
  .nav-buttons {
    display: flex;
    gap: 6px;
  }
  .nav-btn {
    background: var(--surface2);
    border: none;
    color: var(--text);
    border-radius: 8px;
    width: 40px;
    height: 36px;
    font-size: 1.2rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
    font-family: var(--font);
  }
  .nav-btn:hover:not(:disabled) { background: var(--accent); }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }
</style>
</head>
<body>

<div class="timer-bar">
  <button class="timer-btn" id="timerToggle">Start</button>
  <span class="timer-display" id="timerDisplay">00∶00∶00</span>
  <button class="timer-btn destructive" id="timerReset">Reset</button>
</div>

<div class="main-area">
  <div class="preview current-slide">
    <div class="preview-label">Current Slide</div>
    <div class="preview-slide"><div class="preview-slide-inner" id="currentPreview"></div></div>
  </div>
  <div class="preview next-slide" id="nextPreviewBox">
    <div class="preview-label">Next Slide</div>
    <div class="preview-slide"><div class="preview-slide-inner" id="nextPreview"></div></div>
  </div>
  <div class="notes-panel">
    <div class="notes-label">Speaker Notes</div>
    <div class="notes-content" id="notesContent">
      <span class="notes-empty">No notes for this slide</span>
    </div>
  </div>
</div>

<div class="bottom-bar">
  <span class="slide-counter" id="slideCounter">0 / 0</span>
  <div class="nav-buttons">
    <button class="nav-btn" id="btnPrev" title="Previous (←)">‹</button>
    <button class="nav-btn" id="btnNext" title="Next (→)">›</button>
  </div>
</div>

<script>
(function() {
  'use strict';

  var opener = window.opener;
  var els = {
    timerDisplay: document.getElementById('timerDisplay'),
    timerToggle: document.getElementById('timerToggle'),
    timerReset: document.getElementById('timerReset'),
    currentPreview: document.getElementById('currentPreview'),
    nextPreview: document.getElementById('nextPreview'),
    nextPreviewBox: document.getElementById('nextPreviewBox'),
    notesContent: document.getElementById('notesContent'),
    slideCounter: document.getElementById('slideCounter'),
    btnPrev: document.getElementById('btnPrev'),
    btnNext: document.getElementById('btnNext'),
  };

  var customStyleEl = null;

  function send(msg) {
    if (opener && !opener.closed) opener.postMessage(msg, '*');
  }

  /* ── Timer ── */
  var timerRunning = false;
  var timerStart = 0;
  var timerElapsed = 0;
  var timerRaf = null;

  function fmtTime(s) {
    var h = Math.floor(s / 3600);
    var m = Math.floor((s % 3600) / 60);
    var sec = Math.floor(s % 60);
    return String(h).padStart(2, '0') + '\u2236' +
           String(m).padStart(2, '0') + '\u2236' +
           String(sec).padStart(2, '0');
  }

  function tickTimer() {
    if (!timerRunning) return;
    var now = (Date.now() - timerStart) / 1000 + timerElapsed;
    els.timerDisplay.textContent = fmtTime(now);
    timerRaf = requestAnimationFrame(tickTimer);
  }

  els.timerToggle.addEventListener('click', function() {
    if (timerRunning) {
      timerRunning = false;
      timerElapsed += (Date.now() - timerStart) / 1000;
      cancelAnimationFrame(timerRaf);
      els.timerToggle.textContent = 'Resume';
    } else {
      timerRunning = true;
      timerStart = Date.now();
      els.timerToggle.textContent = 'Pause';
      tickTimer();
    }
  });

  els.timerReset.addEventListener('click', function() {
    timerRunning = false;
    timerElapsed = 0;
    cancelAnimationFrame(timerRaf);
    els.timerDisplay.textContent = fmtTime(0);
    els.timerToggle.textContent = 'Start';
  });

  /* ── Render markdown notes using marked ── */
  function mdToHTML(md) {
    if (!md || !md.trim()) return '';
    if (typeof marked !== 'undefined' && marked.parse) {
      try { return marked.parse(md, { gfm: true, breaks: true }); } catch(e) { /* fall through */ }
    }
    /* Fallback if marked didn't load */
    var s = md
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>')
      .replace(/^\s*[-*]\s+(.+)$/gm, '\u2022 $1<br>')
      .replace(/\n{2,}/g, '</p><p>')
      .replace(/\n/g, '<br>');
    return '<p>' + s + '</p>';
  }

  /* ── Build a slide preview thumbnail ── */
  function buildPreview(container, slideHTML, style, bgSrc) {
    container.innerHTML = '';

    /* Apply background color/gradient */
    if (style) {
      container.style.backgroundColor = style.bg || 'white';
      if (style.bgImage && style.bgImage !== 'none') {
        container.style.backgroundImage = style.bgImage;
      } else {
        container.style.backgroundImage = '';
      }
    }

    /* Background media image */
    if (bgSrc) {
      var img = document.createElement('img');
      img.className = 'slide-bg-img';
      img.src = bgSrc;
      container.appendChild(img);
    }

    /* Slide content replica */
    var replica = document.createElement('div');
    replica.className = 'slide-replica';
    if (style && style.color) {
      replica.style.color = style.color;
    }
    replica.innerHTML = slideHTML || '';

    /* Scale the 1920×1080 replica to fit the container */
    var containerWidth = container.offsetWidth || 300;
    var scale = containerWidth / 1920;
    replica.style.transform = 'scale(' + scale + ')';

    container.appendChild(replica);
  }

  function buildNextPreview(container, md, bgSrc, style) {
    container.innerHTML = '';

    if (style) {
      container.style.backgroundColor = style.bg || 'white';
      if (style.bgImage && style.bgImage !== 'none') {
        container.style.backgroundImage = style.bgImage;
      } else {
        container.style.backgroundImage = '';
      }
    }

    if (bgSrc) {
      var img = document.createElement('img');
      img.className = 'slide-bg-img';
      img.src = bgSrc;
      container.appendChild(img);
    }

    /* For the next slide we don't have rendered HTML, so do simple heading extraction */
    var replica = document.createElement('div');
    replica.className = 'slide-replica';
    if (style && style.color) {
      replica.style.color = style.color;
    }

    if (md && md.trim()) {
      var html = md
        .replace(/!\[[^\]]*\]\([^)]+\)/g, '') /* strip images */
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/^######\s+(.+)$/gm, '<h4>$1</h4>')
        .replace(/^#####\s+(.+)$/gm, '<h4>$1</h4>')
        .replace(/^####\s+(.+)$/gm, '<h4>$1</h4>')
        .replace(/^###\s+(.+)$/gm, '<h3>$1</h3>')
        .replace(/^##\s+(.+)$/gm, '<h2>$1</h2>')
        .replace(/^#\s+(.+)$/gm, '<h1>$1</h1>')
        .replace(/\n+/g, '');
      replica.innerHTML = html;
    }

    var containerWidth = container.offsetWidth || 300;
    var scale = containerWidth / 1920;
    replica.style.transform = 'scale(' + scale + ')';

    container.appendChild(replica);
  }

  /* ── Apply custom CSS from the presentation ── */
  function applyCustomCSS(css) {
    if (customStyleEl) {
      customStyleEl.remove();
      customStyleEl = null;
    }
    if (!css) return;
    /* Rewrite Podium selectors to target replicas inside previews */
    var rewritten = css
      .replace(/^(\s*)slide\b/gm, '$1.slide-replica')
      .replace(/\blabel\.header\b/g, '.preview-header-label')
      .replace(/\blabel\.footer\b/g, '.preview-footer-label')
      .replace(/\bmedia-slide\b/g, '.media-slide')
      .replace(/\btitle-list-slide\b/g, '.slide-replica.title-list-slide')
      .replace(/(?<![-\w])title-slide\b/g, '.slide-replica.title-slide');
    customStyleEl = document.createElement('style');
    customStyleEl.textContent = rewritten;
    document.head.appendChild(customStyleEl);
  }

  /* ── Receive messages from main window ── */
  window.addEventListener('message', function(e) {
    if (!e.data || e.data.type !== 'slide-update') return;
    var d = e.data;

    els.slideCounter.textContent = (d.index + 1) + ' / ' + d.total;

    /* Apply custom CSS once (or if it changed) */
    if (d.customCSS !== undefined) {
      applyCustomCSS(d.customCSS);
    }

    /* Current slide preview — use the actual rendered HTML from main window */
    buildPreview(els.currentPreview, d.slideHTML, d.slideStyle, d.slideStyle ? d.slideStyle.bgMediaSrc : '');

    /* Next slide preview */
    if (d.hasNext) {
      buildNextPreview(els.nextPreview, d.nextFull || d.nextTitle, d.nextBgSrc, d.slideStyle);
      els.nextPreviewBox.classList.add('has-next');
    } else {
      els.nextPreview.innerHTML = '<span class="preview-end">End of presentation</span>';
      els.nextPreview.style.backgroundColor = '';
      els.nextPreview.style.backgroundImage = '';
      els.nextPreviewBox.classList.remove('has-next');
    }

    /* Notes */
    if (d.notes && d.notes.trim()) {
      els.notesContent.innerHTML = mdToHTML(d.notes);
    } else {
      els.notesContent.innerHTML = '<span class="notes-empty">No notes for this slide</span>';
    }

    els.btnPrev.disabled = d.index === 0;
    els.btnNext.disabled = d.index >= d.total - 1;
  });

  /* ── Navigation ── */
  els.btnPrev.addEventListener('click', function() { send({ type: 'nav-prev' }); });
  els.btnNext.addEventListener('click', function() { send({ type: 'nav-next' }); });

  document.addEventListener('keydown', function(e) {
    switch (e.key) {
      case 'ArrowRight': case ' ': case 'n':
        e.preventDefault();
        send({ type: 'nav-next' });
        break;
      case 'ArrowLeft': case 'p':
        e.preventDefault();
        send({ type: 'nav-prev' });
        break;
    }
  });

  /* ── Rescale previews on resize ── */
  function rescalePreviews() {
    var replicas = document.querySelectorAll('.slide-replica');
    replicas.forEach(function(r) {
      var container = r.parentElement;
      var scale = (container.offsetWidth || 300) / 1920;
      r.style.transform = 'scale(' + scale + ')';
    });
  }
  window.addEventListener('resize', rescalePreviews);

  /* Request current state from main window */
  send({ type: 'request-state' });
})();
</script>
</body>
</html>
