<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Podium Viewer</title>
<script src="marked.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ─── Landing ─── -->
<div id="landing">
  <h1>Podium <span>Viewer</span></h1>
  <p class="sub">Browser-based presentation viewer for the Podium format</p>
  <div class="drop-zone" id="dropZone">
    <div class="icon"><img src="podium.svg" alt="Podium" width="64" height="64"></div>
    <div class="label">Drop a <strong>.podium</strong> file here</div>
    <div class="hint">or click to browse</div>
    <input type="file" id="fileInput" accept=".podium">
  </div>

</div>



<!-- ─── Loading ─── -->
<div id="loading">
  <div class="spinner"></div>
  <span class="msg">Loading presentation&hellip;</span>
</div>

<!-- ─── Toast ─── -->
<div id="toast"></div>

<!-- ─── Viewer ─── -->
<div id="viewer">
  <div id="topbar">
    <span class="brand">Podium <span>Viewer</span></span>
    <span class="filename" id="fileName"></span>
    <div class="spacer"></div>
    <button id="btnFullscreen" title="Fullscreen (F)" aria-label="Fullscreen">
      <svg width="16" height="16" viewBox="0 0 16 16"><path d="M 10 1 L 15 1 L 15 6 M 10 6 L 15 1 M 1 10 L 1 15 L 6 15 M 6 10 L 1 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
    </button>
    <button id="btnClose" title="Close" aria-label="Close">
      <svg width="16" height="16" viewBox="0 0 16 16"><path d="M 5 11 L 11 5 M 5 5 L 11 11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
    </button>
  </div>

  <div id="slide-area">
    <button class="nav-arrow prev" id="btnPrev" aria-label="Previous slide">&#x2039;</button>
    <button class="nav-arrow next" id="btnNext" aria-label="Next slide">&#x203A;</button>

    <div id="slide-frame">
      <div class="slide-header" id="slideHeader"></div>
      <div id="slide-content"></div>
      <div class="slide-footer" id="slideFooter"></div>
    </div>

    <div id="counter">0 / 0</div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
